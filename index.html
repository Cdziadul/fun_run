<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Fun Run — Alien Escape</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 65%, #183445, #0b1020 65%); color: #f0f6ff; font-family: system-ui, sans-serif; }
    main { width: min(90%, 640px); padding: 48px 16px; text-align: center; }
    .eyebrow { color: #65e8ba; font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 18px 0 8px; font-size: clamp(64px, 15vw, 112px); line-height: 1; letter-spacing: -.07em; }
    .subtitle { margin: 20px 0 40px; color: #a8b8cc; font-size: 18px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 18px; min-width: 240px; min-height: 88px; padding: 20px 42px; border: 0; border-radius: 18px; background: #75f3bf; color: #09281e; font: 800 27px system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 0 #278863, 0 18px 55px #54edac24; transition: transform .15s, background .15s; }
    button:hover { background: #a0ffd7; transform: translateY(-2px); }
    button:active { transform: translateY(5px); box-shadow: 0 3px 0 #278863; }
    button:focus-visible { outline: 3px solid white; outline-offset: 8px; }
    .triangle { width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 19px solid currentColor; }
    .controls { margin-top: 38px; color: #8b9bb0; font-size: 13px; line-height: 2; }
    kbd { padding: 3px 7px; border: 1px solid #39485b; border-radius: 5px; color: #dce8f5; font: inherit; }
    #status { min-height: 24px; margin: 24px 0 0; color: #a8b8cc; font-size: 14px; }
    footer { margin-top: 48px; color: #64758b; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Alien escape · Survival runner</p>
    <h1>FUN RUN</h1>
    <p class="subtitle">Keep running. Stay alive. Take aim.</p>
    <button id="play" type="button"><span class="triangle" aria-hidden="true"></span>PLAY</button>
    <p class="controls"><kbd>←</kbd> <kbd>→</kbd> Move &nbsp; <kbd>↑</kbd> Jump &nbsp; <kbd>Space</kbd> Shoot</p>
    <p id="status" role="status"></p>
    <footer>Run fast. Watch the bridges.</footer>
  </main>
  <link rel="stylesheet" href="game.css">
  <script src="game.js"></script>
</body>
</html>
